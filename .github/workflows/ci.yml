name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests

      - name: Version gate
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python scripts/check_version.py --base "origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            python scripts/check_version.py --base "$BEFORE"
          else
            python scripts/check_version.py
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate plugin and marketplace
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
          claude plugin validate .claude-plugin/plugin.json

  release:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag and release the current version if it is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python scripts/check_version.py --print-version)
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; nothing to release."
            exit 0
          fi
          python scripts/check_version.py --tag "$TAG"
          python scripts/check_version.py --release-notes > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
